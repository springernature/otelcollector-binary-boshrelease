# Adds the mimir-rules job (post-start + errand) to the otelcollector instance group.
# Rule sets are added by other ops files (see deployment-add-mimir-rules-*.yml).
# Usage: bosh deploy ... -o deployment-add-mimir-rules.yml \
#          -o deployment-add-mimir-rules-recording.yml -o deployment-add-mimir-rules-alerts.yml \
#          -v mimir_address=https://mimir.example.com -v mimir_tenant_id=my-tenant
- type: replace
  path: /instance_groups/name=otelcollector/jobs/name=mimir-rules?
  value:
    name: mimir-rules
    release: otelcollector-binary
    properties:
      mimir-rules:
        address: ((mimir_address))
        tenant_id: ((mimir_tenant_id))
        sync_mode: sync
